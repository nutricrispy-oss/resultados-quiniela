<script>
(function(){
  try{
    var t=localStorage.getItem('crz_theme');
    if(!t){t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
    document.documentElement.setAttribute('data-theme',t);
  }catch(e){}
})();
</script>
<style>
:root{
  --bg:#EEF2F9; --surface:#FFFFFF; --ink:#12203A; --muted:#5B6B88; --line:#D8E0EE;
  --accent:#0038A8; --accent-ink:#FFFFFF; --field:#F4F7FC;
  --hero:#0F1E3F; --hero-muted:#AFBDDA; --gold:#FFC83D;
  --prize:#0B6B3A; --prize-bg:#E3F5EA; --wa:#1FAF5A; --red:#D52B1E;
  --shadow:0 1px 2px rgba(15,30,63,.08),0 6px 18px rgba(15,30,63,.06);
}
[data-theme="dark"]{
  --bg:#0C1220; --surface:#151D31; --ink:#EAF0FC; --muted:#93A2C2; --line:#25304A;
  --accent:#6C97FF; --accent-ink:#0C1220; --field:#0F1729;
  --hero:#1B2A55; --hero-muted:#B7C4E3; --gold:#FFC83D;
  --prize:#FFC83D; --prize-bg:#2A2A1C; --wa:#25C866;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));min-height:100vh}
.stripe{height:5px;background:linear-gradient(90deg,var(--red) 0 33.3%,#fff 33.3% 66.6%,#0038A8 66.6% 100%)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 6px;max-width:640px;margin:0 auto}
header h1{margin:0;font-size:20px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
header h1 small{display:block;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.hbtns{display:flex;gap:8px}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;min-width:44px;height:44px;font-size:20px;cursor:pointer;padding:0 10px}
.icon-btn.txt{font-size:14px;font-weight:700}
main{max-width:640px;margin:0 auto;padding:8px 16px 24px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer;min-height:44px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:17px;font-weight:800}
.card p.hint{margin:0 0 12px;font-size:13px;color:var(--muted)}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.inp{display:flex;align-items:center;background:var(--field);border:1.5px solid var(--line);border-radius:12px;padding:0 12px}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.inp i{font-style:normal;font-weight:700;color:var(--muted);margin-right:8px}
.inp input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:20px;font-weight:700;padding:12px 0;outline:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid3 .inp input{font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.posrow{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;margin-bottom:12px}
.posrow::-webkit-scrollbar{display:none}
.pos{flex:0 0 auto;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);font-size:16px;font-weight:800;cursor:pointer}
.pos.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hero{background:var(--hero);color:#fff;border-radius:22px;padding:20px 18px;margin-bottom:14px;border:2px solid var(--gold)}
.hero .lbl{font-size:14px;font-weight:700;color:var(--hero-muted)}
.hero .big{font-size:clamp(34px,11vw,52px);line-height:1.05;font-weight:900;color:var(--gold);margin:6px 0 14px;letter-spacing:-.02em;word-break:break-word}
.hero .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid rgba(255,255,255,.18);padding:10px 0 0;margin-top:10px}
.hero .row span{font-size:14px;color:var(--hero-muted);font-weight:600}
.hero .row b{font-size:22px;font-weight:900;color:#fff;text-align:right}
.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
.actions{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:14px}
.btn{border:0;border-radius:14px;min-height:50px;padding:0 18px;font-size:16px;font-weight:800;cursor:pointer;color:#fff;background:var(--wa)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.full{width:100%;margin-top:6px}
.tbl{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.tr{display:grid;grid-template-columns:.8fr 1.5fr 1.3fr 1.3fr;gap:6px;padding:10px 12px;border-top:1px solid var(--line);align-items:center;font-size:13px}
.tr:first-child{border-top:0}
.tr.th{background:var(--field);font-weight:800;color:var(--muted);font-size:12px}
.tr .r{text-align:right}
.tr .pz{font-weight:900;font-size:14px;color:var(--prize);background:var(--prize-bg);border-radius:8px;padding:6px 8px;text-align:right}
.tr .pn{font-weight:800;font-size:15px}
.list .li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list .li:first-child{border-top:0}
.list .li .nm{font-weight:800;font-size:15px;min-width:54px}
.list .li .am{font-weight:900;font-size:17px;color:var(--prize);background:var(--prize-bg);border-radius:10px;padding:6px 10px;text-align:right}
.list .li .mini{width:96px}
.list .li .mini input{font-size:15px;padding:8px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav .in{display:flex;width:100%;max-width:640px;gap:6px}
.tabbtn{flex:1;min-width:0;border:0;background:transparent;color:var(--muted);border-radius:12px;padding:6px 1px;font-size:10.5px;font-weight:700;cursor:pointer;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabbtn span{font-size:20px;line-height:1}
.tabbtn.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
#toast.show{opacity:1}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:6px 0 0}

.balls{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 5px;margin-bottom:6px}
.ball{border:0;background:none;padding:0;cursor:pointer;color:inherit;text-align:center;font:inherit}
.ball small{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:3px}
.ball b{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:50%;background:var(--prize-bg);color:var(--prize);font-size:clamp(12px,3.6vw,17px);font-weight:900;border:1.5px solid color-mix(in srgb,var(--prize) 55%,transparent)}
.ball.top b{background:var(--prize);color:var(--surface);border-color:var(--prize)}
.meta{font-size:12px;color:var(--muted);margin:0 0 12px}
.banner{background:var(--prize-bg);color:var(--prize);font-weight:800;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.dcard .em{font-size:36px;line-height:1.1}
.dcard .no{font-size:12px;color:var(--muted);font-weight:700;margin-top:4px}
.dcard .nm{font-weight:900;font-size:14px;color:var(--prize);margin-top:2px;word-break:break-word}
.inp.locked{background:transparent;border-style:dashed}
.inp.locked input{color:var(--muted);cursor:default}
.inp i.lk{margin:0 0 0 6px;font-size:14px}
.disc{max-width:640px;margin:0 auto;padding:0 16px 12px;text-align:center;color:var(--muted);font-size:12px}
.disc p{margin:4px 0}
.inp textarea{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;font-weight:600;padding:12px 0;outline:0;resize:vertical}
.warn{background:color-mix(in srgb,var(--red) 16%,transparent);border:1.5px solid var(--red);color:var(--ink);font-weight:800;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.ball.hit b{background:var(--gold);color:#12203A;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 40%,transparent)}
.foto{display:block;width:100%;max-height:42vh;object-fit:contain;border-radius:12px;border:1px solid var(--line);background:var(--field);margin-bottom:6px;cursor:zoom-in}
.foto.big{max-height:none;cursor:zoom-out}
.lcard{border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0;background:var(--field)}
.lhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.icon-btn.sm{min-width:36px;height:36px;font-size:15px;padding:0 8px}
.linkbtn{border:0;background:none;color:inherit;text-decoration:underline;font:inherit;font-weight:800;cursor:pointer;padding:0 0 0 6px}
#bol .btn{margin-bottom:10px}
#bol .chips{flex-wrap:wrap;overflow:visible}
#bol .list .li{align-items:flex-start}
#bol .list .li .am{white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:24px 0;font-weight:700}
</style>
</head>
<body>
<div class="stripe"></div>
<header>
  <h1>Cálculos de premios<small>by CRz</small></h1>
  <div class="hbtns">
    <button class="icon-btn txt" id="install" hidden>Instalar</button>
    <button class="icon-btn" id="theme" aria-label="Cambiar modo claro u oscuro">🌙</button>
  </div>
</header>
<main id="app"></main>
<footer class="disc"><p><b>Esta app fue creada solo con fines informativos y no comerciales.</b></p><p>Cálculos de premios by CRz</p></footer>
<nav><div class="in">
  <button class="tabbtn" data-tab="calc"><span>🧮</span>Calcular</button>
  <button class="tabbtn" data-tab="tabla"><span>📋</span>Tabla</button>
  <button class="tabbtn" data-tab="mil"><span>💵</span>Por mil</button>
  <button class="tabbtn" data-tab="res"><span>🎰</span>Resultados</button>
  <button class="tabbtn" data-tab="sue"><span>💭</span>Sueños</button>
  <button class="tabbtn" data-tab="bol"><span>🧾</span>Boleta</button>
</div></nav>
<div id="toast"></div>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const fmt=n=>String(Math.round(Number(n)||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const gs=n=>'Gs. '+fmt(n);
const num=s=>Number(String(s).replace(/\D/g,''))||0;
const one=n=>Math.max(1,n||1);

const NAMES={c3:'3 cifras',c2:'2 cifras',c1:'1 cifra',red:'Redoblona',inv:'Invertida'};
const DEF={
  games:{
    c3:{apuesta:10000,veces:400,rep:2,max:600,postura:2},
    c2:{apuesta:50000,veces:60,rep:2,max:600,postura:2},
    c1:{apuesta:500000,veces:6,rep:2,max:600,postura:2},
    inv:{apuesta:5000,veces:450,rep:2,max:800,postura:1},
    red:{apuesta:5000,p1:1,p2:7,v1:60,v2:60,rep:2,max:900}
  },
  game:'c3', tg:'c3', tab:'calc',
  mil:{a:1000,grupo:'5',c:1000,rows:{}}
};
const KEY='crz_premios_v1';
let S=load();
function load(){
  const base=JSON.parse(JSON.stringify(DEF));
  try{
    const raw=JSON.parse(localStorage.getItem(KEY)||'null');
    if(raw){
      for(const g in base.games){ if(raw.games&&raw.games[g]) Object.assign(base.games[g],raw.games[g]); }
      ['game','tg','tab'].forEach(k=>{ if(raw[k]) base[k]=raw[k]; });
      if(raw.mil) Object.assign(base.mil,raw.mil);
    }
  }catch(e){}
  for(const g in base.games){ const d=DEF.games[g]; ['veces','rep','max','v1','v2'].forEach(k=>{ if(k in d) base.games[g][k]=d[k]; }); }
  if(!NAMES[base.game]) base.game='c3';
  if(!NAMES[base.tg]||base.tg==='red') base.tg='c3';
  return base;
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }

/* ---------- Cálculos (igual que la planilla) ---------- */
function calc(g,s){
  if(g==='red'){
    const p=s.apuesta*s.v1/one(s.p1)*s.v2/one(s.p2);
    return {premio:p,rep:p*s.rep,max:s.apuesta*s.max/one(s.p1)};
  }
  const po=Math.min(14,one(s.postura));
  const p=s.apuesta*s.veces/po;
  const sinRep=(g!=='inv')&&po===1;
  let rp=sinRep?null:p*s.rep, mx=sinRep?null:s.apuesta*s.max/po, capped=false;
  // Reglamento Art. 12 / 41.8: con repeticiones nunca se paga más que el máximo (se liquida una sola vez).
  if(rp!=null&&mx!=null&&rp>mx){rp=mx;capped=true;}
  return {premio:p,rep:rp,max:mx,capped};
}
// Reglamento: postura 1 a 14; redoblona: postura 2 de 7 a 14 y no menor que la postura 1 (Art. 42.3 y 42.4).
function validar(g,s){
  if(g==='red'){
    if(s.p1<1||s.p1>14) return 'La postura 1 va de 1 a 14.';
    if(s.p2<7||s.p2>14) return 'La postura 2 (redoblona) va de 7 a 14.';
    if(s.p2<s.p1) return 'La postura 2 no puede ser menor que la postura 1.';
    return '';
  }
  if(s.postura<1||s.postura>14) return 'La postura va de 1 a 14.';
  return '';
}

/* ---------- Utilidades de UI ---------- */
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800);}
function wa(text){window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');}
async function copy(text){
  try{await navigator.clipboard.writeText(text);toast('Copiado');}
  catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copiado');}catch(_){toast('No se pudo copiar');}ta.remove();}
}
function pop(el){if(!el)return;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
function field(id,label,val,o={}){
  const lk=o.lock?' readonly aria-readonly="true" tabindex="-1"':'';
  return `<label class="fld"><span>${label}</span><div class="inp${o.lock?' locked':''}">${o.pre?`<i>${o.pre}</i>`:''}<input id="${id}" data-k="${o.k||id}" data-money="${o.money?1:0}" type="text" inputmode="${o.lock?'none':'numeric'}" autocomplete="off" value="${o.money?fmt(val):val}"${lk}>${o.lock?'<i class="lk" title="Fijo según el reglamento">🔒</i>':''}</div></label>`;
}
function bindInputs(root,getS,onChange){
  $$('input[data-k]',root).forEach(inp=>{
    inp.addEventListener('input',()=>{
      const v=num(inp.value);
      if(inp.dataset.money==='1') inp.value=v?fmt(v):'';
      else if(inp.value!==String(v)&&inp.value!=='') inp.value=String(v);
      if(inp.readOnly) return;
      getS()[inp.dataset.k]=v; save(); onChange();
    });
    inp.addEventListener('focus',()=>setTimeout(()=>{try{inp.select();}catch(e){}},0));
  });
}
function chipsHTML(list,cur,attr){return `<div class="chips">${list.map(g=>`<button class="chip ${g===cur?'on':''}" ${attr}="${g}">${NAMES[g]}</button>`).join('')}</div>`;}

/* ---------- Pestaña: Calcular ---------- */
function renderCalc(app){
  const g=S.game, s=S.games[g], red=g==='red';
  let h=chipsHTML(['c3','c2','c1','red','inv'],g,'data-game');
  h+=`<section class="card"><h2>${NAMES[g]}</h2><p class="hint">Cambiá los montos y el resultado se calcula solo. Los datos con 🔒 son fijos, según el reglamento del juego.${red?' La redoblona se juega solo sobre las 2 últimas cifras: postura 1 de 1 a 14 y postura 2 de 7 a 14, nunca menor que la 1.':g==='inv'?' El monto es por cada combinación; el total jugado es 6 veces ese monto.':''}</p>`;
  h+=field('apuesta','Apuesta',s.apuesta,{money:1,pre:'Gs.'});
  if(red){
    h+=`<div class="grid2">${field('p1','Postura 1',s.p1)}${field('p2','Postura 2',s.p2)}</div>`;
    h+=`<div class="grid2">${field('v1','Veces que paga (1)',s.v1,{lock:1})}${field('v2','Veces que paga (2)',s.v2,{lock:1})}</div>`;
    h+=field('max','Pago máximo (veces)',s.max,{lock:1});
  }else{
    h+=`<label class="fld" style="margin-bottom:6px"><span>Postura</span></label><div class="posrow">${Array.from({length:14},(_,i)=>`<button class="pos ${s.postura===i+1?'on':''}" data-pos="${i+1}">${i+1}</button>`).join('')}</div>`;
    h+=`<div class="grid3">${field('postura','Postura',s.postura)}${field('veces','Veces que paga',s.veces,{lock:1})}${field('rep','Repeticiones',s.rep,{lock:1})}</div>`;
    h+=field('max','Pago máximo (veces)',s.max,{lock:1});
  }
  h+=`</section>`;
  h+=`<div id="vmsg" class="warn" hidden></div>`;
  h+=`<section class="hero" id="hero"><div class="lbl">${red?'Premio redoblona':'Premio'}</div><div class="big" id="r-premio"></div>
    ${red?'':'<div class="row"><span id="l-rep"></span><b id="r-rep"></b></div>'}
    <div class="row"><span id="l-max"></span><b id="r-max"></b></div></section>`;
  h+=`<div class="actions"><button class="btn" id="wa">Compartir por WhatsApp</button><button class="btn ghost" id="cp">Copiar</button></div>`;
  app.innerHTML=h;
  $$('[data-game]',app).forEach(b=>b.onclick=()=>{S.game=b.dataset.game;save();render();});
  $$('[data-pos]',app).forEach(b=>b.onclick=()=>{
    s.postura=Number(b.dataset.pos);save();
    $('#postura').value=s.postura;
    $$('[data-pos]',app).forEach(x=>x.classList.toggle('on',x===b));
    updateCalc();
  });
  bindInputs(app,()=>S.games[S.game],()=>{
    if(!red){ $$('[data-pos]',app).forEach(x=>x.classList.toggle('on',Number(x.dataset.pos)===s.postura)); }
    updateCalc();
  });
  $('#wa').onclick=()=>{const v=validar(S.game,S.games[S.game]);if(v){toast(v);return;}wa(calcText());};
  $('#cp').onclick=()=>{const v=validar(S.game,S.games[S.game]);if(v){toast(v);return;}copy(calcText().replace(/\*/g,''));};
  updateCalc(true);
}
function updateCalc(first){
  const g=S.game,s=S.games[g],r=calc(g,s),v=validar(g,s),ok=!v;
  const vm=$('#vmsg'); vm.textContent=v; vm.hidden=ok;
  $('#r-premio').textContent=ok?gs(r.premio):'—';
  if($('#l-rep')) $('#l-rep').textContent=`Por repeticiones (x${s.rep})`+(r.capped?' · tope del máximo':'');
  $('#l-max').textContent=`Pago máximo (${s.max} veces)`;
  if($('#r-rep')) $('#r-rep').textContent=(!ok||r.rep==null)?'—':gs(r.rep);
  $('#r-max').textContent=(!ok||r.max==null)?'—':gs(r.max);
  if(!first) pop($('#hero'));
}
function calcText(){
  const g=S.game,s=S.games[g],r=calc(g,s);
  let t=`🎯 *Cálculos de premios by CRz*\n🎲 Juego: ${NAMES[g]}\n💵 Apuesta: ${gs(s.apuesta)}\n`;
  if(g==='red') t+=`📍 Posturas: ${s.p1} y ${s.p2} (paga ${s.v1} x ${s.v2})\n`;
  else t+=`📍 Postura: ${s.postura} (paga ${s.veces} veces)\n`;
  t+=`━━━━━━━━━━\n🏆 *PREMIO: ${gs(r.premio)}*\n`;
  if(r.rep!=null&&g!=='red') t+=`🔁 Por repeticiones (x${s.rep})${r.capped?' · tope del máximo':''}: *${gs(r.rep)}*\n`;
  if(r.max!=null) t+=`⭐ Pago máximo (${s.max} veces): *${gs(r.max)}*`;
  return t.trim();
}

const iso2fmt=i=>{const [y,m,d]=i.split('-');return `${d}/${m}/${y}`;};
function fmt2iso(s){
  const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(s||'').trim());
  if(!m) return null;
  const d=+m[1],mo=+m[2],y=+m[3],dt=new Date(y,mo-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d) return null;
  return `${m[3]}-${m[2]}-${m[1]}`;
}
function maskFecha(inp){
  const v=inp.value.replace(/\D/g,'').slice(0,8);
  inp.value=v.length>4?v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4):v.length>2?v.slice(0,2)+'/'+v.slice(2):v;
}
const diasDesde=iso=>Math.round((new Date(hoyStr()+'T12:00:00')-new Date(iso+'T12:00:00'))/86400000);

/* ---- Historial de resultados por fecha (se conservan 120 días) ---- */
const HKEY='crz_hist';
let HIST={};
function saveHist(){try{localStorage.setItem(HKEY,JSON.stringify(HIST));}catch(e){}}
function loadHist(){
  try{HIST=JSON.parse(localStorage.getItem(HKEY)||'{}')||{};}catch(e){HIST={};}
  try{ // migra lo guardado con la versión anterior (solo un día)
    const old=JSON.parse(localStorage.getItem('crz_manual')||'null');
    if(old&&old.fecha&&old.sorteos){HIST[old.fecha]=Object.assign({},old.sorteos,HIST[old.fecha]||{});saveHist();localStorage.removeItem('crz_manual');}
  }catch(e){}
  Object.keys(HIST).forEach(k=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||diasDesde(k)>120) delete HIST[k];});
  saveHist();
}
function sugerido(lista){
  const n=new Date(),m=n.getHours()*60+n.getMinutes();
  const k=m<12*60?'tempranero':m<16*60?'matutino':m<20*60?'vespertino':'nocturno';
  return lista.some(s=>s[0]===k)?k:lista[lista.length-1][0];
}
// Si el texto pegado trae los títulos "SORTEO ...", toma cada sorteo; si no, las primeras 14 cifras de 3 dígitos.
function extraerSorteos(t){
  const up=t.toUpperCase(),out={};
  const pos=SORTEOS.map(s=>({k:s[0],i:up.indexOf('SORTEO '+s[0].toUpperCase())})).filter(x=>x.i>=0).sort((a,b)=>a.i-b.i);
  pos.forEach((x,j)=>{
    const fin=j+1<pos.length?pos[j+1].i:t.length;
    const nums=t.slice(x.i,fin).match(/\b\d{3}\b/g)||[];
    if(nums.length>=14) out[x.k]=nums.slice(0,14);
  });
  return out;
}

let RDATE=null,LD=null;

  const t=$('#paste').value,msg=$('#rmsg');

  if(!iso){msg.textContent='Escribí la fecha completa, por ejemplo 27/11/2026.';return;}
  let found=extraerSorteos(t);
  if(!Object.keys(found).length){
    const nums=t.match(/\b\d{3}\b/g)||[];
    if(nums.length<14){msg.textContent=`Encontré ${nums.length} números de 3 cifras y hacen falta 14.`;return;}
    found[LD]=nums.slice(0,14);
  }
  RDATE=iso;
  HIST[iso]=Object.assign(HIST[iso]||{},found);
  saveHist();
  toast(Object.keys(found).length>1?'Sorteos guardados':'Sorteo guardado');
  renderRes(app);
}

/* ---------- Motor de cálculo de boletas (Reglamento de la Quiniela) ---------- */
const MULT={1:6,2:60,3:400};           // Art. 8: veces que paga a la cabeza (1, 2 y 3 cifras)
const PERMS=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
function evalLinea(L,res){
  const bad=msg=>({ok:false,msg});
  const m=Number(L.m)||0, p=Number(L.p)||0;
  if(!m) return bad('Falta el monto.');
  if(L.tipo==='red'){
    const a=String(L.n||""),b=String(L.n2||""),q2=Number(L.p2)||0;
    if(a.length!==2||b.length!==2) return bad('La redoblona se juega con 2 cifras en cada número.');
    if(p<1||p>14) return bad('La postura 1 va de 1 a 14.');
    if(q2<7||q2>14) return bad('La postura de la redoblona va de 7 a 14.');
    if(q2<p) return bad('La postura de la redoblona no puede ser menor que la primera.');
    const SA=[],SB=[],ini=p===1?2:1,fin=p===1?Math.min(14,q2+1):q2; // Art. 42.8 y 42.9
    for(let i=1;i<=p;i++) if(res[i-1].slice(-2)===a) SA.push(i);
    for(let i=ini;i<=fin;i++) if(res[i-1].slice(-2)===b) SB.push(i);
    let pares=0; SA.forEach(x=>SB.forEach(y=>{if(x!==y) pares++;}));
    const unitario=m*60/p*60/q2, maxPago=900*m/p;                         // Art. 42.10 y 42.11
    const bruto=pares*unitario, premio=Math.min(bruto,maxPago);
    return {ok:true,premio,jugado:m,pos:pares?SA.concat(SB):[],topeado:bruto>maxPago,pares,
      detalle:pares?`Primer número en postura ${SA.join(', ')} y segundo en postura ${SB.join(', ')}`:'No hubo acierto en ambos números'};
  }
  if(p<1||p>14) return bad('La postura va de 1 a 14.');
  const n=String(L.n||'');
  if(L.tipo==='inv'){
    if(n.length!==3) return bad('Escribí las 3 cifras de la invertida.');
    if(new Set(n.split('')).size!==3) return bad('Las 3 cifras de la invertida deben ser distintas.');
    const comb=new Set(PERMS.map(q=>q.map(i=>n[i]).join('')));
    const hits=[];
    for(let i=1;i<=p;i++) if(comb.has(res[i-1])) hits.push(i);
    const unit=m/6/p, bruto=hits.length*unit*450, maxPago=800*unit;       // Art. 41.4 (el importe impreso es el total) y 41.6 a 41.8
    return {ok:true,premio:Math.min(bruto,maxPago),jugado:m,pos:hits,topeado:bruto>maxPago,
      detalle:hits.length?hits.map(i=>`postura ${i} (${res[i-1]})`).join(', '):'No salió ninguna combinación'};
  }
  if(n.length<1||n.length>3) return bad('Escribí el número jugado (1 a 3 cifras).');
  const k=n.length,hits=[];
  for(let i=1;i<=p;i++) if(res[i-1].slice(-k)===n) hits.push(i);
  const unit=m/p, bruto=hits.length*unit*MULT[k], maxPago=600*unit;       // Art. 9, 11 y 12
  return {ok:true,premio:Math.min(bruto,maxPago),jugado:m,pos:hits,topeado:bruto>maxPago,
    detalle:hits.length?hits.map(i=>`postura ${i} (${res[i-1]})`).join(', '):'No salió'};
}
/* ---------- Lectura de la boleta (texto del OCR -> datos) ---------- */
const MESES={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,set:9,sep:9,oct:10,nov:11,dic:12};
function parseBoleta(txt){
  const out={fecha:'',sorteo:'',lines:[],total:null,suma:0,ignoradas:[]};
  const raw=String(txt||'').replace(/[—–_|]/g,' ');
  let m=raw.match(/(\d{1,2})\s*\/\s*([A-Za-z]{3})[a-z]*\s*\/\s*(\d{2,4})/);
  if(m&&MESES[m[2].toLowerCase()]){let y=+m[3];if(y<100)y+=2000;out.fecha=String(+m[1]).padStart(2,'0')+'/'+String(MESES[m[2].toLowerCase()]).padStart(2,'0')+'/'+y;}
  else{m=raw.match(/(\d{1,2})\s*\/\s*(\d{1,2})\s*\/\s*(\d{4}|\d{2})\b/);if(m){let y=+m[3];if(y<100)y+=2000;out.fecha=String(+m[1]).padStart(2,'0')+'/'+String(+m[2]).padStart(2,'0')+'/'+y;}}
  const low=raw.toLowerCase();
  if(/tempran|tempra/.test(low)) out.sorteo='tempranero';
  else if(/matut|matu/.test(low)) out.sorteo='matutino';
  else if(/vesper|vespe|vesp/.test(low)) out.sorteo='vespertino';
  else if(/noctur|noct/.test(low)) out.sorteo='nocturno';
  const AMT='(\\d{1,3}(?:[.,]\\d{3})+)\\s*$';
  const money=s=>Number(s.replace(/[.,]/g,''));
  const postura=tok=>{ // "C1","Cl","CI"=1; "I11"->11; vacío->1
    const r=tok.slice(1).replace(/[lIi|]/g,'1').replace(/\D/g,'');
    let v=r?Number(r):1; if(v>14||v<1) v=Number(r[0])||1; return v;};
  raw.split(/\r?\n/).forEach(ln=>{
    const s=ln.trim(); if(!s) return;
    const t=s.match(new RegExp('total\\D{0,60}'+AMT,'i'));
    if(t){out.total=money(t[1]);return;}
    let a=s.match(new RegExp('(?:^|\\D)(\\d)\\s*[.,]\\s*(\\d)\\s*[.,]\\s*(\\d)\\s+(\\S+)\\s+'+AMT));
    if(a){out.lines.push({tipo:'inv',n:a[1]+a[2]+a[3],p:postura(a[4]),m:money(a[5]),n2:'',p2:7,amb:/\d{2}/.test(a[4].slice(1).replace(/[lIi|]/g,'1'))});return;}
    a=s.match(new RegExp('^\\D{0,4}?(\\d{1,3})\\s+([A-Za-z][A-Za-z0-9|]*)\\s+'+AMT));
    if(a){out.lines.push({tipo:'dir',n:a[1],p:postura(a[2]),m:money(a[3]),n2:'',p2:7,amb:/\d{2}/.test(a[2].slice(1).replace(/[lIi|]/g,'1'))});return;}
    if(/\d[.,]\d{3}\s*$/.test(s)) out.ignoradas.push(s);
  });
  // postura ambigua (p.ej. "I11"): se usa la de las demás jugadas del mismo tipo si coincide
  out.lines.forEach(L=>{if(L.amb){const o=out.lines.filter(x=>x!==L&&!x.amb&&x.tipo===L.tipo).map(x=>x.p);if(o.length&&o.every(v=>v===o[0])&&(L.p===11||L.p===12||L.p===13||L.p===14||L.p>14)) L.p=o[0];}delete L.amb;});
  out.suma=out.lines.reduce((s,L)=>s+L.m,0);
  return out;
}
/*ENDENGINE*/

  });

}

/* ---------- OCR de la foto (Tesseract.js, se descarga solo al usarlo) ---------- */
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ko(new Error('No se pudo cargar '+src));document.head.appendChild(s);});}
function prepImg(img){
  const sc=Math.min(1.6,1600/img.naturalWidth);
  const w=Math.round(img.naturalWidth*sc),hh=Math.round(img.naturalHeight*sc);
  const c=document.createElement('canvas');c.width=w;c.height=hh;const x=c.getContext('2d');x.drawImage(img,0,0,w,hh);
  const d=x.getImageData(0,0,w,hh),p=d.data,g=new Float32Array(w*hh);
  for(let i=0;i<w*hh;i++) g[i]=0.299*p[i*4]+0.587*p[i*4+1]+0.114*p[i*4+2];
  const S=new Float64Array((w+1)*(hh+1));
  for(let y=0;y<hh;y++){let row=0;for(let xx=0;xx<w;xx++){row+=g[y*w+xx];S[(y+1)*(w+1)+xx+1]=S[y*(w+1)+xx+1]+row;}}
  const R=Math.round(Math.max(w,hh)/24),k=0.12;
  for(let y=0;y<hh;y++)for(let xx=0;xx<w;xx++){
    const x0=Math.max(0,xx-R),x1=Math.min(w,xx+R+1),y0=Math.max(0,y-R),y1=Math.min(hh,y+R+1);
    const sum=S[y1*(w+1)+x1]-S[y0*(w+1)+x1]-S[y1*(w+1)+x0]+S[y0*(w+1)+x0];
    const m=sum/((x1-x0)*(y1-y0));const v=g[y*w+xx]<m*(1-k)?0:255;const i=(y*w+xx)*4;p[i]=p[i+1]=p[i+2]=v;
  }
  x.putImageData(d,0,0);return c;
}
const okLectura=r=>r.lines.length>0&&r.total!=null&&r.suma===r.total;
async function leerFoto(url,onProg){
  if(!window.Tesseract){onProg('Descargando el lector (solo la primera vez, ~11 MB)…',0);await loadScript('ocr/tesseract.min.js');}
  const img=new Image();img.src=url;await img.decode();
  const cv=prepImg(img);
  const wk=await Tesseract.createWorker('eng',1,{workerPath:'ocr/worker.min.js',corePath:'ocr/',langPath:'ocr/',gzip:true,
    logger:m=>{if(m.status==='recognizing text')onProg('Leyendo la boleta…',m.progress);else if(/loading|initializing/.test(m.status))onProg('Preparando el lector…',m.progress||0);}});
  try{
    let best=null;
    for(const psm of ['6','4']){
      await wk.setParameters({tessedit_pageseg_mode:psm,preserve_interword_spaces:'1'});
      const r=await wk.recognize(cv);
      const pr=parseBoleta(r.data.text);
      if(!best||(pr.lines.length>best.lines.length&&!okLectura(best))||okLectura(pr)&&!okLectura(best)) best=pr;
      if(okLectura(best)&&best.fecha&&best.sorteo) break;
    }
    return best;
  }finally{try{await wk.terminate();}catch(e){}}
}
let LECT=null; // resultado de la última lectura (para el aviso)
async function hacerLectura(app,btn){
  const box=$('#lect',app);btn.disabled=true;
  const prog=(t,f)=>{box.innerHTML=`<p class="meta" style="font-weight:700">${t}${f?` ${Math.round(f*100)}%`:''}</p>`;};

    const r=await leerFoto(FOTO,prog);
    if(!r||!r.lines.length){box.innerHTML=`<div class="warn">No pude leer jugadas en la foto. Probá con otra foto más derecha, con buena luz y sin sombras, o cargá los datos a mano abajo.</div>`;btn.disabled=false;return;}
    if(r.fecha) BOL.fecha=r.fecha;
    if(r.sorteo) BOL.sorteo=r.sorteo;
    BOL.lines=r.lines.map(L=>Object.assign(nuevaLinea(),L));
    saveBol();
    const av=[];
    if(!r.fecha) av.push('No pude leer la fecha.');
    if(!r.sorteo) av.push('No pude leer el sorteo.');
    if(r.total==null) av.push('No encontré el total impreso para comprobar.');
    else if(r.suma!==r.total) av.push(`La suma de los montos leídos (${gs(r.suma)}) no coincide con el total de la boleta (${gs(r.total)}): falta o está mal leída alguna jugada.`);
    if(r.ignoradas.length) av.push(`No pude interpretar ${r.ignoradas.length} línea(s) con importe (por ejemplo redoblonas): cargalas a mano.`);
    LECT={ok:!av.length,av};

    const bx=$('#lect',app);
    bx.innerHTML=LECT.ok?`<div class="meta" style="font-weight:800;color:var(--green,inherit)">✅ Leí ${r.lines.length} jugada(s) y la suma coincide con el total ${gs(r.total)}. Igual, revisá los datos contra la boleta.</div>`:`<div class="warn">${av.join('<br>')}<br>Revisá y corregí los datos abajo.</div>`;
  }catch(e){
    box.innerHTML=`<div class="warn">No se pudo leer la foto (${e&&e.message?e.message:'error'}). Si es la primera vez, hace falta internet para descargar el lector. Podés cargar los datos a mano.</div>`;btn.disabled=false;
  }
}
function calcBol(){
  const out={iso:fmt2iso(BOL.fecha),res:null,filas:[],total:0,jugado:0,listo:false,errores:[]};
  if(!out.iso){out.err='Escribí la fecha de la boleta completa, por ejemplo 27/11/2026.';return out;}
  const d=diasDesde(out.iso);
  if(d<0){out.err='La fecha de la boleta es posterior a hoy.';return out;}
  if(d>60) out.aviso=`Pasaron ${d} días del sorteo. Según el reglamento (Art. 40) los premios se abonan hasta 60 días después.`;
  const res=(HIST[out.iso]||{})[BOL.sorteo];
  if(!res||res.length<14){out.falta=true;return out;}
  out.res=res;
  BOL.lines.forEach((L,i)=>{
    const r=evalLinea(L,res);
    out.filas.push({L,r});
    if(!r.ok) out.errores.push(`Jugada ${i+1}: ${r.msg}`);
    else{out.total+=r.premio;out.jugado+=r.jugado;}
  });
  out.listo=out.errores.length===0;
  return out;
}
function updateBol(){

  h+=`<section class="card"><h2>Jugadas</h2><div class="list">${c.filas.map(({L,r},i)=>{
    const tit=`${TNAME[L.tipo]} ${L.tipo==='red'?`${L.n} (post. ${L.p}) y ${L.n2} (post. ${L.p2})`:`${L.n} · postura ${L.p}`}`;
    if(!r.ok) return `<div class="li"><div><div class="nm">Jugada ${i+1}</div><div class="meta" style="margin:2px 0 0;color:var(--red);font-weight:700">${r.msg}</div></div></div>`;
    const extra=[L.tipo==='inv'?`Importe total ${gs(r.jugado)} (${gs(r.jugado/6)} por combinación)`:`Jugado ${gs(r.jugado)}`,r.topeado?'se paga el máximo del reglamento':'',(L.tipo==='red'&&r.pares>1)?'con repeticiones: la liquidación exacta la define el concesionario':''].filter(Boolean).join(' · ');
    return `<div class="li"><div style="min-width:0"><div class="nm" style="min-width:0">${tit}</div><div class="meta" style="margin:2px 0 0">${r.detalle}. ${extra}</div></div><span class="am">${r.premio>0?gs(r.premio):'Sin premio'}</span></div>`;
  }).join('')}</div></section>`;
  if(c.listo){

function bolText(c){

  });
  return t+`━━━━━━━━━━\n🏆 *PREMIO TOTAL: ${gs(c.total)}*`;

/* ---------- Sueños 00-99 ---------- */
let QUERY='';
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function renderSue(app){
  app.innerHTML=`<section class="card"><h2>Sueños del 00 al 99</h2><p class="hint">Buscá por número o por palabra.</p><div class="inp"><i>🔍</i><input id="q" type="text" inputmode="search" autocomplete="off" placeholder="Ej: 05 o gato" value=""></div></section><div class="dgrid" id="dg"></div>`;
  const q=$('#q');q.value=QUERY;
  q.addEventListener('input',()=>{QUERY=q.value;updSue();});
  updSue();
}
function updSue(){
  const q=norm(QUERY.trim());
  const dig=/^\d+$/.test(q);
  const list=DREAMS.map((d,i)=>({i,e:d[0],n:d[1]})).filter(x=>{
    if(!q) return true;
    const pad=p2(x.i);
    if(dig) return q.length===1?(pad.startsWith('0'+q)||pad.startsWith(q)):pad===q.slice(0,2);
    return norm(x.n).includes(q);
  });
  $('#dg').innerHTML=list.length?list.map(x=>`<div class="dcard"><div class="em">${x.e}</div><div class="no">Nº ${p2(x.i)}</div><div class="nm">${x.n}</div></div>`).join(''):`<div class="empty" style="grid-column:1/-1">No hay coincidencias.</div>`;
}

/* ---------- Navegación, tema e instalación ---------- */
function render(){
  $$('.tabbtn').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const app=$('#app');
  if(S.tab==='tabla') renderTabla(app); else if(S.tab==='mil') renderMil(app); else if(S.tab==='res') renderRes(app); else if(S.tab==='sue') renderSue(app); else if(S.tab==='bol') renderBol(app); else renderCalc(app);
  window.scrollTo(0,0);
}
$$('.tabbtn').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;save();render();});

function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  $('#theme').textContent=t==='dark'?'☀️':'🌙';
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content',t==='dark'?'#0C1220':'#0038A8');
}
$('#theme').onclick=()=>{
  const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  applyTheme(t);
  try{localStorage.setItem('crz_theme',t);}catch(e){}
};
applyTheme(document.documentElement.getAttribute('data-theme'));

let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#install').hidden=false;});
$('#install').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('#install').hidden=true;};
window.addEventListener('appinstalled',()=>{$('#install').hidden=true;});

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
loadHist();loadBol();
render();
</script>
