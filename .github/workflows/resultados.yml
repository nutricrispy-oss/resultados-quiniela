name: Actualizar resultados

on:
  schedule:
    # Hora de Paraguay (UTC-3) pasada a UTC
    - cron: '45 13 * * *'   # 10:45
    - cron: '45 15 * * *'   # 12:45
    - cron: '30 19 * * *'   # 16:30
    - cron: '15 23 * * *'   # 20:15
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resultados
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node scrape.mjs
      - name: Guardar cambios
        run: |
          git config user.name "resultados-bot"
          git config user.email "actions@users.noreply.github.com"
          git add resultados.json
          git diff --cached --quiet || (git commit -m "Resultados $(date -u '+%F %H:%M') UTC" && git push)
